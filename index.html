<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tri Tactics Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: board left and command panel right on laptop; board on top, panel underneath on phone. */
:root{
  --bg:#F3EFE4; --panel:#FBF9F3; --line:#D8D2C2; --fg:#1E241D; --muted:#4D5648;
  --accent:#A8461A; --accent-fg:#FFFFFF; --navy:#263B5E; --mine:#C4561F; --soft:#E6E0D0; --warn-bg:#FBE7D9; --warn-fg:#6E2A0A; --ok-bg:#E3EEDF; --ok-fg:#233A22;
  --scrim:rgba(20,26,20,.72);
  --land:#6F8563; --wood:#627856; --sea:#88AFBC; --bank:#1F2B22; --frame:#23382E; --grid:#A3B297;
  --display:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171B17; --panel:#20261F; --line:#3A4237; --fg:#ECEBE4; --muted:#B4BAAB;
  --accent:#D0652F; --accent-fg:#16120E; --soft:#2B3229; --warn-bg:#3B2417; --warn-fg:#F3C9AF; --ok-bg:#22331F; --ok-fg:#CFE5C6; --scrim:rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171B17; --panel:#20261F; --line:#3A4237; --fg:#ECEBE4; --muted:#B4BAAB;
  --accent:#D0652F; --accent-fg:#16120E; --soft:#2B3229; --warn-bg:#3B2417; --warn-fg:#F3C9AF; --ok-bg:#22331F; --ok-fg:#CFE5C6; --scrim:rgba(0,0,0,.75); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 32px}
button{font-family:inherit;font-size:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #F2B632;outline-offset:2px}
.top{max-width:1100px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.08em}
.sub{color:var(--muted);font-size:14px}
.pill{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:15px;padding:3px 10px;border-radius:4px;background:var(--accent);color:var(--accent-fg)}
.pill.wait{background:var(--navy);color:#fff}
.pill.done{background:var(--soft);color:var(--fg)}
.top .spacer{flex:1}
.app{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,660px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);gap:14px}}

/* Board */
.boardwrap{display:grid;grid-template-columns:1.4em minmax(0,1fr);grid-template-rows:1.4em auto;gap:4px;max-width:660px;width:100%}
.files,.ranks{display:grid;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.files{grid-template-columns:repeat(12,minmax(0,1fr));text-align:center;padding:0 3px;align-items:end}
.ranks{grid-template-rows:repeat(12,minmax(0,1fr));align-items:center;justify-items:end;padding:3px 0}
.board{container-type:inline-size;width:100%;aspect-ratio:1;max-width:100%;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));gap:1px;background:var(--grid);border:3px solid var(--frame);border-radius:6px;overflow:hidden}
.cell{position:relative;display:block;border:0;padding:0;margin:0;background:var(--land);cursor:pointer;min-width:0;min-height:0}
.cell.wood{background:var(--wood)}
.cell.sea{background:var(--sea)}
.cell > span{position:absolute;display:block;pointer-events:none}
.rb{background:var(--bank)} .rw{background:var(--sea)}
.rb.h{left:0;right:0;top:26%;height:48%} .rw.h{left:0;right:0;top:35%;height:30%}
.rb.hl{left:0;right:26%;top:26%;height:48%} .rw.hl{left:0;right:35%;top:35%;height:30%}
.rb.hr{left:26%;right:0;top:26%;height:48%} .rw.hr{left:35%;right:0;top:35%;height:30%}
.rb.vu{top:0;bottom:26%;left:26%;width:48%} .rw.vu{top:0;bottom:35%;left:35%;width:30%}
.rb.vd{top:26%;bottom:0;left:26%;width:48%} .rw.vd{top:35%;bottom:0;left:35%;width:30%}
.lk1{inset:6%;border-radius:22%;background:var(--bank)} .lk2{inset:17%;border-radius:18%;background:var(--sea)}
.hq{inset:0;border:.45cqi solid #FFF8EC;display:flex !important;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:3.1cqi;color:#FFF8EC}
.pc{inset:7%;border-radius:12%;overflow:hidden}
.pc.face{background:#F2EEE2}
.pc.mine{border:.45cqi solid var(--mine)}
.pc.enemy{border:.45cqi solid var(--navy)}
.pc.back{background:var(--navy);border:.45cqi solid #1A2A44}
.pc.back::after{content:"";position:absolute;inset:14%;border:1px solid #6E83A6;border-radius:10%}
.pc .st{position:absolute;left:0;top:0;bottom:0;width:30%}
.pc .st i{position:absolute;left:0;right:0;bottom:0;height:30%}
.pc b{position:absolute;left:30%;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:3.7cqi;color:#141414;line-height:1}
.pc.ghost{opacity:.35}
.warnd{right:6%;top:6%;width:1.6cqi;height:1.6cqi;border-radius:50%;background:#E8622C;border:1px solid #fff}
.dot{left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:#FFF8EC;border:.4cqi solid #141414}
.ring{inset:0;border:.6cqi solid #F2B632;border-radius:10%}
.tgt{inset:0;border:.6cqi solid #E8622C;border-radius:10%;animation:pulse 1.2s ease-in-out infinite}
.lastto{inset:0;border:.45cqi solid #FFF8EC;border-radius:10%}
.lastfrom{inset:14%;border:.35cqi dashed #FFF8EC;border-radius:12%}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.tgt{animation:none}}

/* Panel */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
.lbl{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted);font-size:14px}
p{margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.attack{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600;text-align:left;width:100%}
.btn.ghostbtn{border-color:transparent;background:transparent;color:var(--accent)}
.sel{display:flex;gap:14px;align-items:center}
.sel svg{flex:none}
.lvl{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;border:0;background:var(--panel);cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.vs svg{animation:flip .55s cubic-bezier(.2,.7,.2,1) both;transform-origin:50% 50%}
.vs > div:last-child svg{animation-delay:.25s}
@keyframes flip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:perspective(600px) rotateY(0)}}
@media (prefers-reduced-motion: reduce){.vs svg{animation:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.points{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.points li.good::marker{color:#2E9B3A}.points li.bad::marker{color:var(--accent)}
.leftcol{display:flex;flex-direction:column;gap:14px;min-width:0;max-width:660px;width:100%}
.tray{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tray.drop{outline:3px dashed #F2B632;outline-offset:-3px;cursor:pointer}
.trayhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.trayhead .lbl{color:var(--fg)}
.trow{display:flex;flex-wrap:wrap;gap:8px}
.tgroup{display:flex;flex-direction:column;gap:6px}
.tgroup .muted{font-size:13px}
.tk{position:relative;width:46px;height:46px;border:0;padding:0;background:none;cursor:pointer;border-radius:6px;flex:none}
.tk .pc{position:absolute;display:block;inset:2px;border-radius:5px}
.tk .pc.mine,.tk .pc.enemy{border-width:3px}
.tk .pc b{font-size:22px}
.tk .cnt{position:absolute;right:-5px;top:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.tk.on{outline:3px solid #F2B632;outline-offset:1px}
.tk:disabled{opacity:.28;cursor:default}
@media (max-width:420px){.tk{width:40px;height:40px}.tk .pc b{font-size:19px}}
.zone{inset:0;background:rgba(255,248,236,.2)}
.btn:disabled{opacity:.45;cursor:default}
.intel{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--soft);padding-top:10px}
.ir{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
@media (max-width:420px){.ir{grid-template-columns:minmax(0,1fr);gap:4px}}
.il{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted);padding-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:2px 8px;border-radius:999px;font-size:13px;border:1px solid var(--line)}
.chip.win{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.chip.lose{background:var(--warn-bg);color:var(--warn-fg);border-color:transparent}
.chip.draw{background:var(--soft)}
.notes{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.guide .card{gap:8px}
.warn{padding:10px 12px;background:var(--warn-bg);color:var(--warn-fg);border-radius:8px;font-size:14px}
.ok{padding:10px 12px;background:var(--ok-bg);color:var(--ok-fg);border-radius:8px;font-size:14px}
.forces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.force{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;border-top:5px solid var(--mine)}
.force.cpu{border-top-color:var(--navy)}
.force .n{font-family:var(--display);font-weight:700;font-size:22px}
.log{display:flex;flex-direction:column;max-height:260px;overflow:auto}
.log div{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--soft);font-size:14px}
.log span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:20px;height:20px;border-radius:3px;flex:none}

/* Dialogs */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.dlg{background:var(--panel);color:var(--fg);border-radius:16px;padding:22px 20px;width:100%;max-width:460px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg.wide{max-width:980px}
.vs{display:flex;align-items:center;justify-content:center;gap:10px}
.vs > div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px;font-weight:600;min-width:0}
.vs svg{width:100%;max-width:180px;height:auto}
.vs .v{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);flex:none}
.result{font-family:var(--display);font-weight:700;font-size:28px;text-align:center;line-height:1.1}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.ct{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.ct th,table.ct td{border:1px solid var(--soft);padding:4px 5px;text-align:center;white-space:nowrap}
table.ct th{font-family:var(--display);font-weight:700;font-size:13px;background:var(--soft)}
table.ct td.s{color:var(--accent);font-weight:600}
.rules{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.rules h3{font-family:var(--display);font-size:20px;margin:6px 0 0}
</style>
</head>
<body>


<header class="top">
  <div class="brand">TRI TACTICS</div>
  <div class="sub">Practice against the computer</div>
  <span id="status" class="pill">SET UP</span>
  <span class="spacer"></span>
  <button class="btn" id="btnSound" type="button" aria-pressed="true">Sound on</button>
  <button class="btn" id="btnRules" type="button">Rules and combat table</button>
</header>

<main class="app">
  <div class="leftcol">
  <div class="boardwrap">
    <span></span>
    <div class="files" id="files"></div>
    <div class="ranks" id="ranks"></div>
    <div class="board" id="board" role="group" aria-label="Tri Tactics board"></div>
  </div>
  <section class="tray" id="tray" aria-live="polite"></section>
  </div>
  <aside class="side">
    <section class="card" id="action" aria-live="polite"></section>
    <div class="forces">
      <div class="force"><div class="muted">South · you</div><div class="n" id="cntMe">56 pieces</div></div>
      <div class="force cpu"><div class="muted">North · computer</div><div class="n" id="cntCpu">56 pieces</div></div>
    </div>
    <section class="card">
      <div class="lbl">CAMPAIGN LOG</div>
      <div class="log" id="log"></div>
    </section>
    <section class="card">
      <div class="legend">
        <span><span class="sw" style="background:#F2EEE2;border:3px solid var(--mine)"></span>Your cards</span>
        <span><span class="sw" style="background:var(--navy)"></span>Computer, face down</span>
        <span><span class="sw" style="background:#F2EEE2;border:3px solid var(--navy)"></span>Computer, revealed</span>
        <span><span class="sw" style="background:#E8622C;border-radius:50%;width:12px;height:12px"></span>Out of its element</span>
      </div>
      <div class="lvl"><span class="lbl">COMPUTER STRENGTH</span><div class="seg" id="seg" role="group" aria-label="Computer strength"><button type="button" data-level="easy">Easy</button><button type="button" data-level="normal">Normal</button><button type="button" data-level="hard">Hard</button></div></div>
      <div class="row"><button class="btn" id="btnReport" type="button">Battle report</button><button class="btn ghostbtn" id="btnNew" type="button">Start a new game</button></div>
    </section>
  </aside>
</main>
<div id="modal"></div>

<script>
(function(){
'use strict';
// ---------- Rules engine ----------
const SIZE=12;
const UNITS=[["I1","Battalion","infantry",1,5],["I2","Brigade","infantry",2,4],["I3","Division","infantry",3,3],["I4","Army Corps","infantry",4,2],["I5","Army","infantry",5,1],["AA","Anti-Aircraft Gun","artillery",0,4],["FA","Field Artillery","artillery",0,3],["HA","Heavy Artillery","artillery",0,2],["A1","Reconnaissance Plane","air",1,4],["A2","Bomber","air",2,3],["A3","Two-seat Fighter","air",3,2],["FB","Flying Boat","flyingboat",0,4],["SM","Submarine","ship",0,1],["N1","Destroyer","ship",1,4],["N2","Cruiser","ship",2,3],["N3","Battleship","ship",3,2],["N4","Aircraft Carrier","ship",4,1],["SL","Searchlight","auxiliary",0,8]].map(([id,name,group,rank,count])=>({id,name,group,rank,count}));
const T=Object.fromEntries(UNITS.map(u=>[u.id,u]));
const DESC={I1:'Infantry. Can capture the enemy H.Q.',I2:'Infantry. Can capture the enemy H.Q.',I3:'Infantry. Can capture the enemy H.Q.',I4:'Infantry. Can capture the enemy H.Q.',I5:'Infantry. Can capture the enemy H.Q.',AA:'Artillery. Brings down aircraft and Flying Boats.',FA:'Artillery. Strong against infantry.',HA:'Artillery. Sinks ships on a river or across the coastline.',A1:'Aircraft. Moves over land or sea. Captures Searchlights.',A2:'Aircraft. Destroys infantry and Field Artillery across the coastline.',A3:'Aircraft. Moves over land or sea.',FB:'Beats aircraft at sea but loses to them over land.',SM:'Ship. Sinks other ships. Can capture the Lake.',N1:'Ship. Can capture the enemy Lake by the river.',N2:'Ship. Can capture the enemy Lake by the river.',N3:'Ship. Can capture the enemy Lake by the river.',N4:'Ship. Can capture the enemy Lake by the river.',SL:'Moves any distance in a straight line, but only to attack.'};
const VAL={I1:1.2,I2:2,I3:3,I4:4,I5:5,AA:2.5,FA:3,HA:5,A1:2,A2:5,A3:4,FB:4,SM:4,N1:3,N2:4,N3:5,N4:6,SL:1};
const other=s=>s==='south'?'north':'south';
const xy=(x,y)=>y*SIZE+x;
const pos=n=>({x:n%SIZE,y:Math.floor(n/SIZE)});
const BASES={north:{hq:xy(5,0),lake:xy(9,1),mouth:xy(6,2)},south:{hq:xy(5,11),lake:xy(9,10),mouth:xy(6,9)}};
const BOARD=Array.from({length:SIZE*SIZE},(_,n)=>{const {x,y}=pos(n);
  for(const side of ['south','north']){if(n===BASES[side].hq)return{terrain:'land',base:'hq',side};if(n===BASES[side].lake)return{terrain:'lake',base:'lake',side};}
  if((y===2||y===9)&&x>=6&&x<=9)return{terrain:'river',side:y===2?'north':'south',mouth:x===6};
  if((y===3||y===8)&&x<=6)return{terrain:'sea'};
  if(y>=4&&y<=7&&x<=7)return{terrain:'sea'};
  return{terrain:'land'};});
const WOOD=new Set(['1,1','2,1','3,1','2,0','10,4','10,5','9,5','10,6','1,10','0,10','6,11','7,10']);
const coord=n=>String.fromCharCode(65+n%SIZE)+(SIZE-Math.floor(n/SIZE));
const isLand=t=>['infantry','artillery'].includes(T[t].group);
const isShip=t=>T[t].group==='ship';
const adjacent=(a,b)=>{const p=pos(a),q=pos(b);return Math.abs(p.x-q.x)+Math.abs(p.y-q.y)===1};
const dist=(a,b)=>{const p=pos(a),q=pos(b);return Math.abs(p.x-q.x)+Math.abs(p.y-q.y)};
const setupSquares=side=>BOARD.map((_,n)=>n).filter(n=>{const y=pos(n).y;return (side==='north'?y<5:y>=7)&&!BOARD[n].base});

// Combat table, as read from the photographed original value table.
const M=Object.fromEntries(UNITS.map(u=>[u.id,{}]));
function pair(a,b,w){M[a][b]=w;M[b][a]=w}
for(const p of ['I','N','A']){const max=p==='I'?5:p==='N'?4:3;for(let i=1;i<=max;i++)for(let j=i;j<=max;j++)pair(p+i,p+j,i===j?'X':p+j)}
pair('FA','FA','X');pair('HA','HA','X');pair('FB','FB','X');
pair('I1','AA','I1');pair('I1','FA','FA');pair('I1','A2','A2');pair('I1','SL','I1');
pair('I2','FA','FA');pair('I2','HA','HA');pair('I2','A2','C');pair('I2','A3','A3');
pair('I3','FA','X');pair('I3','HA','HA');pair('I3','A2','A2');
pair('I4','FA','I4');pair('I4','HA','HA');pair('I4','A2','C');
pair('I5','FA','I5');pair('I5','HA','HA');pair('I5','A2','C');
for(let i=1;i<=5;i++)pair('I'+i,'FB','C');
pair('AA','FA','FA');for(const id of ['A1','A2','A3','FB'])pair('AA',id,'AA');
pair('FA','HA','HA');pair('FA','A2','C');pair('FA','A3','A3');pair('FA','FB','C');
pair('HA','A2','A2');pair('A1','SL','A1');
for(const id of ['A1','A2','A3'])pair(id,'FB','*');
for(const id of ['SM','N1','N2','N3','N4']){pair(id,'AA','D');pair(id,'HA','P')}
for(const id of ['N1','N2','N3','N4'])pair('SM',id,'SM');

// The table is read attacker row → attacked column. One square differs by direction:
M.I1.A1='I1'; // a Battalion attacking a Reconnaissance Plane wins; the reverse is blank

function combat(att,def){
  const a=att.type,d=def.type,ta=BOARD[att.at],td=BOARD[def.at];
  const el=(t,c)=>c.terrain==='river'?(isShip(t)?'sea':'land'):(c.terrain==='lake'?'sea':c.terrain);
  const ea=el(a,ta),ed=el(d,td),coast=ea!==ed,river=ta.terrain==='river'||td.terrain==='river';
  const wins=(p,r)=>({ra:p===def,rd:p===att,r});
  const none=r=>({ra:false,rd:false,r});
  const typeWins=(t,r)=>({ra:a!==t,rd:d!==t,r});
  for(const [s,l] of [[att,def],[def,att]]){
    if(isShip(s.type)&&s.riverApproach&&BOARD[s.at].terrain==='river'&&isLand(l.type))
      return wins(l.type==='HA'?l:s,l.type==='HA'?'Heavy Artillery sinks the ship on the river.':'A ship on its river approach defeats land forces.');
  }
  if(coast){
    for(const [ai,l] of [[att,def],[def,att]]){
      if(['A2','FB'].includes(ai.type)&&(T[l.type].group==='infantry'||l.type==='FA'))return wins(ai,'Bombers and Flying Boats destroy infantry and Field Artillery across the coastline.');
    }
    if((isShip(a)&&isLand(d))||(isLand(a)&&isShip(d))){
      const land=isLand(a)?att:def,ship=isShip(a)?att:def;
      if(land.type==='HA')return wins(land,'Heavy Artillery sinks ships across the coastline.');
      if(land.type==='AA')return wins(ship,'Ships destroy Anti-Aircraft guns across the coastline.');
      return {ra:true,rd:false,r:'An attack across the coastline between land and ship forfeits the attacker.'};
    }
  }
  for(const [p,e] of [[def,att],[att,def]]){
    const c=BOARD[p.at];
    if(c.terrain==='sea'&&isLand(p.type)&&['ship','flyingboat','air','auxiliary'].includes(T[e.type].group))return wins(e,T[p.type].name+' caught out of its element at sea is forfeit.');
    if(c.terrain==='land'&&isShip(p.type)&&['infantry','artillery','air','flyingboat','auxiliary'].includes(T[e.type].group))return wins(e,T[p.type].name+' caught out of its element on land is forfeit.');
  }
  const res=M[a][d]||'';
  if(res==='X')return{ra:true,rd:true,r:'Equal strength: both pieces are removed.'};
  // § squares: the Bomber or Flying Boat wins only across the coastline (handled above); anywhere else nothing happens
  if(res==='C')return coast?wins(['A2','FB'].includes(a)?att:def,'Bombers and Flying Boats destroy infantry and Field Artillery across the coastline.'):none('Not across the coastline, so nothing happens: both pieces remain.');
  if(res==='*'){
    if(coast)return none('Flying Boat and aircraft across the coastline: neither is removed.');
    const fb=a==='FB'?att:def,air=a==='FB'?def:att;
    return wins(ea==='sea'?fb:air,ea==='sea'?'Flying Boat beats aircraft at sea.':'Aircraft beats Flying Boat over land.');
  }
  if(res==='P')return (river||coast)?typeWins('HA','Heavy Artillery sinks the ship.'):none('These pieces only clash on a river or across the coastline.');
  if(res==='D')return (river||coast)?wins(isShip(a)?att:def,'The ship destroys the Anti-Aircraft gun.'):none('These pieces only clash on a river or across the coastline.');
  return res?typeWins(res,T[res].name+' wins on the value table.'):none('Nothing happens: both pieces remain.');
}

function arrange(side){
  const force=UNITS.flatMap(u=>Array.from({length:u.count},(_,i)=>({id:side+'-'+u.id+'-'+i,side,type:u.id,at:null,revealed:false,riverApproach:null,baseEntered:null})));
  const cells=setupSquares(side);
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  const used=new Set();
  const take=pref=>{const n=pref.find(c=>!used.has(c))??cells.find(c=>!used.has(c));used.add(n);return n};
  const sea=cells.filter(n=>BOARD[n].terrain==='sea'),land=cells.filter(n=>BOARD[n].terrain!=='sea');
  const home=BASES[side].hq,lake=BASES[side].lake;
  const near=(target)=>land.slice().sort((a,b)=>dist(a,target)-dist(b,target));
  // A little sense: a Heavy Artillery near the river, strong infantry near H.Q.
  const order=force.slice().sort((p,q)=>(isShip(q.type)?1:0)-(isShip(p.type)?1:0));
  for(const p of order){
    if(isShip(p.type))p.at=take(sea);
    else if(p.type==='HA'&&!force.some(f=>f.type==='HA'&&f.at!==null&&dist(f.at,lake)<4))p.at=take(near(lake));
    else if(p.type==='I5'||p.type==='I4')p.at=take(near(home));
  }
  for(const p of force.filter(p=>p.at===null&&isLand(p.type)))p.at=take(land);
  for(const p of force.filter(p=>p.at===null))p.at=take(cells);
  return force;
}

function newGame(){
  return{phase:'setup',pieces:[...arrange('south').map(p=>Object.assign(p,{at:null})),...arrange('north')],turn:'south',turnNumber:0,sideTurns:{south:0,north:0},winner:null,history:[],last:null,lost:{south:{},north:{}},level:(G&&G.level)||'normal',timeline:[],events:[],deep:{south:0,north:0}};
}
function pieceAt(g,n){return g.pieces.find(p=>p.at===n)}
function legal(g,piece){
  if(!piece)return[];
  const {x,y}=pos(piece.at),occ=new Set(g.pieces.map(p=>p.at)),out=[];
  for(const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){
    for(let s=1;s<SIZE;s++){
      const nx=x+dx*s,ny=y+dy*s;
      if(nx<0||nx>=SIZE||ny<0||ny>=SIZE)break;
      const at=xy(nx,ny);if(occ.has(at))break;
      if(s===1||(piece.type==='SL'&&g.pieces.some(p=>p.side!==piece.side&&adjacent(at,p.at))))out.push(at);
      if(piece.type!=='SL')break;
    }
  }
  return out;
}
function projectRA(piece,from,to){
  if(!isShip(piece.type))return piece.riverApproach;
  const c=BOARD[to],o=BOARD[from];
  if(c.terrain==='river'){
    if(c.mouth&&o.terrain==='sea'&&adjacent(from,to))return c.side;
    if(!(o.terrain==='river'&&o.side===c.side))return null;
    return piece.riverApproach;
  }
  if(c.terrain!=='lake')return null;
  return piece.riverApproach;
}
function isWin(piece,from,to,ra){
  const c=BOARD[to],o=BOARD[from];
  const hq=c.base==='hq'&&c.side!==piece.side&&T[piece.type].group==='infantry';
  const lake=c.base==='lake'&&c.side!==piece.side&&isShip(piece.type)&&ra===c.side&&o.terrain==='river'&&o.side===c.side;
  return hq?'hq':(lake?'lake':null);
}
function outOfElement(p){
  const t=BOARD[p.at].terrain;
  return (isLand(p.type)&&(t==='sea'||t==='lake'))||(isShip(p.type)&&t==='land');
}
function material(g,side){return g.pieces.filter(p=>p.side===side).reduce((a,p)=>a+VAL[p.type],0)}
function snapTimeline(g){(g.timeline||(g.timeline=[])).push({n:g.turnNumber,s:material(g,'south'),c:material(g,'north')})}
// Applies a move. Returns {text, combat, win}
function applyMove(g,side,id,to,targetId){
  const piece=g.pieces.find(p=>p.id===id&&p.side===side);
  const from=piece.at;
  const ra=projectRA(piece,from,to);
  piece.riverApproach=ra;piece.at=to;
  g.turnNumber++;g.sideTurns[side]++;
  const who=side==='south'?'You':'Computer';
  const ev={from,to,side,combat:null,win:null};
  const w=isWin(piece,from,to,ra);
  if(w){g.winner=side;g.phase='over';piece.revealed=true;g.last={from,to,side};
    ev.win=w;ev.text=who+(side==='south'?' capture':' captures')+' the '+(w==='hq'?'Headquarters':'Naval Base')+' with '+(side==='south'?'your ':'its ')+T[piece.type].name+'.';
    g.history.push({n:g.turnNumber,t:ev.text});snapTimeline(g);return ev;}
  piece.baseEntered=BOARD[to].base?g.sideTurns[side]:null;
  const nm=side==='south'?T[piece.type].name+' ':'';
  let text=who+' moved '+nm+coord(from)+' → '+coord(to)+'.';
  if(targetId){
    const target=g.pieces.find(p=>p.id===targetId);
    const r=combat(piece,target);
    const wasHidden={a:!piece.revealed,d:!target.revealed};
    piece.revealed=true;target.revealed=true;
    ev.combat={att:{type:piece.type,side},def:{type:target.type,side:target.side},at:target.at,ra:r.ra,rd:r.rd,r:r.r,hidden:wasHidden};
    (g.events||(g.events=[])).push({n:g.turnNumber,side,att:piece.type,def:target.type,ra:r.ra,rd:r.rd,blind:wasHidden.d,
      cause:/element/.test(r.r)?'element':/coastline/.test(r.r)?'coast':/river/.test(r.r)?'river':'table',sea:BOARD[target.at].terrain!=='land'});
    text+=' '+T[piece.type].name+' attacked '+T[target.type].name+' at '+coord(target.at)+'. '+r.r;
    if(r.ra){g.pieces=g.pieces.filter(p=>p.id!==piece.id);g.lost[side][piece.type]=(g.lost[side][piece.type]||0)+1}
    if(r.rd){g.pieces=g.pieces.filter(p=>p.id!==target.id);g.lost[target.side][target.type]=(g.lost[target.side][target.type]||0)+1}
  } else text+=' No attack.';
  const expired=g.pieces.filter(p=>p.side===side&&p.baseEntered!==null&&p.baseEntered<g.sideTurns[side]&&BOARD[p.at].base);
  for(const p of expired){text+=' '+(side==='south'?'Your ':'A computer ')+T[p.type].name+' at '+coord(p.at)+' stayed on a base and is forfeit.';g.lost[side][p.type]=(g.lost[side][p.type]||0)+1;(g.events||(g.events=[])).push({n:g.turnNumber,side,base:true,type:p.type})}
  if(T[piece.type].group==='infantry'&&g.pieces.includes(piece)){const y=pos(to).y,adv=side==='south'?11-y:y;g.deep=g.deep||{south:0,north:0};g.deep[side]=Math.max(g.deep[side],adv)}
  if(expired.length){const ids=new Set(expired.map(p=>p.id));g.pieces=g.pieces.filter(p=>!ids.has(p.id))}
  ev.text=text;g.history.push({n:g.turnNumber,t:text});g.last={from,to,side};
  g.turn=other(side);
  snapTimeline(g);
  if(!g.pieces.some(p=>p.side===g.turn&&legal(g,p).length)){g.winner=side;g.phase='over';g.history.push({n:g.turnNumber,t:(g.turn==='south'?'You have':'The computer has')+' no legal moves left.'})}
  return ev;
}

// ---------- Computer opponent ----------
function pool(g){ // what the computer can deduce about your unrevealed pieces
  const c={};
  for(const u of UNITS)c[u.id]=u.count-(g.lost.south[u.id]||0);
  for(const p of g.pieces)if(p.side==='south'&&p.revealed)c[p.type]--;
  return c;
}
function beliefFor(pl,cell){
  const t=BOARD[cell].terrain,out=[];let sum=0;
  for(const id in pl){if(pl[id]<=0)continue;
    let w=pl[id];
    if(t==='sea'||t==='lake'){w*=isLand(id)?0.25:(isShip(id)||id==='FB'?3:1)}
    else{w*=isShip(id)?0.25:(isLand(id)?2:1)}
    out.push([id,w]);sum+=w}
  return out.map(([id,w])=>[id,w/sum]);
}
function expAttack(attacker,defender,belief){ // gain for attacker side
  if(defender.known){const r=combat(attacker,defender);return (r.rd?VAL[defender.type]:0)-(r.ra?VAL[attacker.type]:0)}
  let s=0;for(const [t,pr] of belief){const d={type:t,at:defender.at,riverApproach:null};const r=combat(attacker,d);s+=pr*((r.rd?VAL[t]:0)-(r.ra?VAL[attacker.type]:0))}
  return s;
}
function danger(g,me,at,pl){ // expected loss if a nearby enemy attacks me next turn
  let worst=0;
  for(const s of g.pieces){
    if(s.side!=='south')continue;const d=dist(s.at,at);if(d<1||d>2)continue;
    const ghost={type:me.type,at,riverApproach:me.riverApproach};
    let loss=0;
    if(s.revealed){const r=combat({type:s.type,at:s.at,riverApproach:s.riverApproach},ghost);loss=r.rd?VAL[me.type]:0}
    else{for(const [t,pr] of beliefFor(pl,s.at)){const r=combat({type:t,at:s.at,riverApproach:null},ghost);if(r.rd)loss+=pr*VAL[me.type]}}
    worst=Math.max(worst,loss);
  }
  return worst;
}
// Strength settings. Easy: noisy and careless. Normal: weighs risk. Hard: also defends its bases and hunts raiders.
const LEVELS={easy:{noise:1.6,danger:0,threat:0,rand:.3,info:0},normal:{noise:.25,danger:.55,threat:.5,rand:0,info:.2},hard:{noise:.05,danger:.85,threat:1.3,rand:0,info:.35}};
function threats(g){ // your pieces menacing the computer's H.Q. or Lake
  const s=new Set();
  for(const p of g.pieces){if(p.side!=='south')continue;
    const c=BOARD[p.at];
    if(dist(p.at,BASES.north.hq)<=3&&!(p.revealed&&T[p.type].group!=='infantry'))s.add(p.id);
    if(c.terrain==='river'&&c.side==='north'&&(!p.revealed||isShip(p.type)))s.add(p.id);
    if(dist(p.at,BASES.north.mouth)<=1&&(!p.revealed||isShip(p.type)))s.add(p.id);
  }
  return s;
}
function posScore(piece,at,ra){
  let s=0;const t=piece.type,c=BOARD[at];
  if(T[t].group==='infantry')s-=dist(at,BASES.south.hq)*0.12*(1+T[t].rank*0.1);
  else if(isShip(t)){
    if(ra==='south'&&(c.terrain==='river'||c.terrain==='lake'))s+=3-dist(at,BASES.south.lake)*0.3;
    else s-=dist(at,xy(6,8))*0.06;
  }
  if(isLand(t)&&(c.terrain==='sea'))s-=VAL[t]*0.5;
  if(isShip(t)&&c.terrain==='land')s-=VAL[t]*0.5;
  if(c.base)s-=1.2;
  return s;
}
function computerMove(g){
  const L=LEVELS[g.level||'normal']||LEVELS.normal,thr=threats(g);
  const pl=pool(g),mine=g.pieces.filter(p=>p.side==='north');
  if(L.rand&&Math.random()<L.rand){
    const opts=[];for(const p of mine)for(const to of legal(g,p))if(dist(p.at,to)===1)opts.push({id:p.id,to,target:null});
    if(opts.length){const o=opts[Math.floor(Math.random()*opts.length)];const e=g.pieces.find(q=>q.side==='south'&&adjacent(q.at,o.to));if(e&&Math.random()<.5)o.target=e.id;return o}
  }
  const onBase=mine.filter(p=>BOARD[p.at].base);
  let best=null;
  for(const p of mine){
    const dests=legal(g,p);if(!dests.length)continue;
    const baseHere=onBase.includes(p);
    for(const to of dests){
      const ra=projectRA(p,p.at,to);
      const w=isWin(p,p.at,to,ra);
      let base=(w?1000:0)+posScore(p,to,ra)-posScore(p,p.at,p.riverApproach);
      if(baseHere)base+=VAL[p.type];
      base-=onBase.filter(q=>q!==p).reduce((a,q)=>a+VAL[q.type],0);
      const long=dist(p.at,to)>1;
      const targets=g.pieces.filter(e=>e.side==='south'&&adjacent(e.at,to));
      const opts=long?[]:[null];
      for(const e of targets)opts.push(e);
      for(const e of opts){
        let sc=base+Math.random()*L.noise;
        const saved={at:p.at,ra:p.riverApproach};p.at=to;p.riverApproach=ra;
        if(e){const ev=expAttack(p,{type:e.type,at:e.at,known:e.revealed,riverApproach:e.riverApproach},beliefFor(pl,e.at));
          sc+=ev+L.info+(thr.has(e.id)?L.threat*(2+Math.max(0,ev)):0)}
        else{sc-=(danger(g,p,to,pl)-danger(g,p,saved.at,pl))*L.danger;
          if(thr.size&&g.pieces.some(q=>thr.has(q.id)&&adjacent(q.at,to)))sc+=L.threat*0.8}
        p.at=saved.at;p.riverApproach=saved.ra;
        if(!best||sc>best.sc)best={sc,id:p.id,to,target:e?e.id:null};
      }
    }
  }
  return best;
}

function onBoard(e){
  const b=e.target.closest('.cell');if(!b||ui.busy)return;
  const n=+b.dataset.n,g=G,me='south',piece=pieceAt(g,n);
  if(g.phase==='setup'){
    if(piece&&piece.side!==me)return;
    const inZone=ZONE.has(n);
    if(ui.trayType){
      if(!inZone)return;
      if(piece){ui.trayType=null;ui.sel=piece.id;render();return}
      const p=g.pieces.find(q=>q.side===me&&q.type===ui.trayType&&q.at===null);
      if(p){p.at=n;sfx('place')}
      if(!g.pieces.some(q=>q.side===me&&q.type===ui.trayType&&q.at===null))ui.trayType=null;
      render();return;
    }
    const sel=ui.sel?g.pieces.find(q=>q.id===ui.sel):null;
    if(!sel){if(piece){ui.sel=piece.id;render()}return}
    if(piece&&piece.id===sel.id){ui.sel=null;render();return}
    if(piece){const t=piece.at;piece.at=sel.at;sel.at=t}else if(inZone)sel.at=n;else return;
    ui.sel=null;render();return;
  }
  if(g.phase!=='play'||g.turn!==me)return;
  if(ui.pending){if(ui.pending.targets.includes(n))commit(n);return}
  if(piece&&piece.side===me){ui.inspect=null;ui.sel=ui.sel===piece.id?null:piece.id;if(ui.sel)sfx('select');render();return}
  if(piece&&piece.revealed&&!ui.sel){ui.inspect=ui.inspect===piece.id?null:piece.id;render();return}
  const sel=ui.sel?g.pieces.find(q=>q.id===ui.sel):null;
  if(sel&&legal(g,sel).includes(n)){
    const targets=g.pieces.filter(q=>q.side!==me&&adjacent(q.at,n)).map(q=>q.at);
    const long=dist(sel.at,n)>1;
    ui.pending={id:sel.id,from:sel.at,to:n,targets};
    ui.sel=null;
    if(!targets.length&&!long){commit(null);return}

}
function commit(targetCell){

}
function undoTurn(){

function startBattle(){

// ---------- Battle report ----------
function report(g){
  const ev=g.events||[],tl=g.timeline||[];
  const mine=ev.filter(e=>!e.base&&e.side==='south'),theirs=ev.filter(e=>!e.base&&e.side==='north');
  const res=e=>e.rd&&!e.ra?'win':e.ra&&!e.rd?'loss':e.ra&&e.rd?'both':'none';
  const count=(a,k)=>a.filter(e=>res(e)===k).length;
  const pct=(a,b)=>b?Math.round(100*a/b):0;
  const blind=mine.filter(e=>e.blind),blindLoss=count(blind,'loss')+count(blind,'both');
  // Kills by type: a card "kills" when the other card is removed and it survives or trades
  const kills={south:{},north:{}};
  for(const e of ev){if(e.base)continue;const attKill=e.rd,defKill=e.ra;const defSide=other(e.side);
    if(attKill)kills[e.side][e.att]=(kills[e.side][e.att]||0)+1;
    if(defKill)kills[defSide][e.def]=(kills[defSide][e.def]||0)+1;}
  const top=k=>Object.entries(k).sort((a,b)=>b[1]-a[1])[0];
  const lossCause={element:0,coast:0,river:0,base:0};
  for(const e of ev){
    if(e.base){if(e.side==='south')lossCause.base++;continue}
    const iLost=(e.side==='south'&&e.ra)||(e.side==='north'&&e.rd);
    if(iLost&&lossCause[e.cause]!==undefined)lossCause[e.cause]++;
  }
  const shipLost=s=>Object.entries(g.lost[s]).filter(([t])=>isShip(t)).reduce((a,[,n])=>a+n,0);
  const airLost=s=>Object.entries(g.lost[s]).filter(([t])=>/^A[1-3]$/.test(t)||t==='FB').reduce((a,[,n])=>a+n,0);
  // Turning point: the single turn with the biggest swing in material balance
  let pivot=null;
  for(let i=1;i<tl.length;i++){const d=(tl[i].s-tl[i].c)-(tl[i-1].s-tl[i-1].c);if(!pivot||Math.abs(d)>Math.abs(pivot.d))pivot={n:tl[i].n,d}}
  if(pivot&&Math.abs(pivot.d)<0.5)pivot=null;
  const pivotText=pivot?(g.history.find(h=>h.n===pivot.n)||{}).t:'';
  let lastFlip=null;for(let i=1;i<tl.length;i++){const a=Math.sign(tl[i-1].s-tl[i-1].c),b=Math.sign(tl[i].s-tl[i].c);if(b&&a!==b)lastFlip=tl[i].n}
  const good=[],bad=[],obs=[];
  if(mine.length>=3&&pct(count(mine,'win'),mine.length)>=55)good.push(`Your attacks won ${pct(count(mine,'win'),mine.length)}% of the time.`);
  if(mine.length>=3&&pct(count(mine,'loss'),mine.length)>=45)bad.push(`${pct(count(mine,'loss'),mine.length)}% of your attacks lost the attacking card.`);
  if(blindLoss>=2)bad.push(`Attacks on face-down cards cost you ${blindLoss} card${blindLoss>1?'s':''}. Probe with Battalions or Searchlights before committing strong cards.`);
  else if(blind.length>=3)good.push(`Your attacks on face-down cards paid off: ${count(blind,'win')} of ${blind.length} won.`);
  if(lossCause.element)bad.push(`${lossCause.element} of your cards were caught out of their element and forfeited.`);
  if(lossCause.coast)bad.push(`${lossCause.coast} of your cards were lost to coastline rules.`);
  if(lossCause.base)bad.push(`${lossCause.base} card${lossCause.base>1?'s were':' was'} forfeited for staying on a base.`);
  const sS=shipLost('south'),sC=shipLost('north');
  if(sS+sC>=2)(sC>sS?good:bad).push(sC>sS?`You won the sea battle: ${sC} computer ships sunk for ${sS} of yours.`:`The computer controlled the sea: you lost ${sS} ships and sank ${sC}.`);
  const aS=airLost('south'),aC=airLost('north');
  if(aS+aC>=2)(aC>aS?good:bad).push(aC>aS?`You won in the air: ${aC} computer aircraft down for ${aS} of yours.`:`You lost the air war: ${aS} aircraft down against ${aC}.`);
  const deep=(g.deep||{}).south||0;
  if(deep>=8)good.push(`Your infantry pushed ${deep} rows forward, deep into enemy territory.`);
  else if(tl.length>40&&deep<5)bad.push(`Your infantry never got more than ${deep} rows forward. The H.Q. can only be taken by infantry.`);
  const tk=top(kills.south);if(tk&&tk[1]>=2)good.push(`Your best performer was the ${T[tk[0]].name}, with ${tk[1]} kills.`);
  const ck=top(kills.north);if(ck&&ck[1]>=2)obs.push(`Its most dangerous card was the ${T[ck[0]].name}, which removed ${ck[1]} of your cards.`);
  if(theirs.length){
    obs.push(`It attacked ${theirs.length} time${theirs.length>1?'s':''} and won ${count(theirs,'win')}.`);
    const tb=theirs.filter(e=>e.blind).length;if(tb)obs.push(`${tb} of its attacks were on your face-down cards, so it was willing to gamble.`);
    const sea=theirs.filter(e=>e.sea).length;obs.push(sea>theirs.length/2?'It fought mostly at sea.':'It fought mostly on land.');
  }
  if((g.deep||{}).north>=7)obs.push(`Its infantry advanced ${(g.deep||{}).north} rows towards your H.Q.`);
  if(g.phase==='over'&&g.winner==='north')obs.push(g.history.slice(-1)[0].t);
  if(!good.length)good.push('Play a few more turns and your strengths will show here.');
  if(!bad.length)bad.push('No clear weaknesses so far.');
  return {mine,theirs,count,pct,blind,pivot,pivotText,lastFlip,good,bad,obs,tl};
}
function chartSVG(tl,pivot){

  const pts=adv.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');

  <rect x="${P}" y="8" width="${W-2*P}" height="${H/2-8}" fill="#2E9B3A" opacity=".08"/><rect x="${P}" y="${H/2}" width="${W-2*P}" height="${H/2-8}" fill="${ac}" opacity=".08"/>
  <line x1="${P}" y1="${H/2}" x2="${W-P}" y2="${H/2}" stroke="${mu}" stroke-dasharray="3 4"/>
  <text x="${P+4}" y="22" font-size="12" fill="${mu}">You ahead</text><text x="${P+4}" y="${H-14}" font-size="12" fill="${mu}">Computer ahead</text>
  <polyline points="${pts}" fill="none" stroke="${fg}" stroke-width="2.2" stroke-linejoin="round"/>
  ${pi>=0?`<circle cx="${x(pi)}" cy="${y(adv[pi])}" r="6" fill="${ac}"/><text x="${Math.min(x(pi)+8,W-90)}" y="${Math.max(y(adv[pi])-10,14)}" font-size="12" font-weight="600" fill="${ac}">Turning point</text>`:''}
  <text x="${P}" y="${H-1}" font-size="11" fill="${mu}">Turn ${tl[0].n}</text><text x="${W-P}" y="${H-1}" font-size="11" fill="${mu}" text-anchor="end">Turn ${tl[tl.length-1].n}</text></svg>`;
}

  <h3>Moving and attacking</h3><p>Move one card one square forwards, backwards or sideways onto an empty square, never diagonally. After moving you may attack one enemy card next to it. Both cards are revealed and the loser is removed; the winner stays where it is. Searchlights may move any distance in a straight line, but only to attack.</p>
  <h3>Winning</h3><p>Move infantry (1–5) into the enemy H.Q., or bring a ship (Submarine included, Flying Boat not) in at the river mouth from the sea, up the river and into the enemy Lake.</p>
  <h3>Out of its element</h3><p>Land forces caught at sea by ships, aircraft or Searchlights are forfeit, and ships caught on land by land forces, aircraft or Searchlights are forfeit. A ship and a land force attacking each other across the coastline: the attacker is forfeit, except that Heavy Artillery sinks ships and ships destroy Anti-Aircraft guns. Bombers and Flying Boats destroy infantry and Field Artillery across the coastline.</p>
  <h3>Bases</h3><p>You may cross an H.Q. or Lake, but must move off it on your next turn or the card is forfeit.</p>
  <h3>Value table</h3><p class="muted">Each square shows the winner. X both removed · blank nothing happens · § Bomber or Flying Boat wins across the coastline, otherwise nothing happens · * Flying Boat wins at sea, aircraft win over land · ¶ Heavy Artillery sinks the ship on a river or across the coastline · † ship destroys the gun on a river or across the coastline.</p>
  </div><div class="tablewrap">${t}</div>
  <div class="h2" style="margin-top:8px">Card by card</div>
  <div class="guide">${UNITS.map(u=>`<div class="card"><div class="sel">${cardSVG(u.id,'south',120)}<div><div class="h2" style="font-size:22px">${u.name}</div><div class="muted">${u.count} per side</div></div></div>${intel(u.id)}</div>`).join('')}</div>
  <div class="row"><button class="btn primary" data-close type="button">Close</button></div></div>`);
}
// ---------- Boot ----------
function boot(){
  $('files').innerHTML='ABCDEFGHIJKL'.split('').map(l=>`<span>${l}</span>`).join('');
  $('ranks').innerHTML=Array.from({length:12},(_,i)=>`<span>${12-i}</span>`).join('');
  $('board').addEventListener('click',onBoard);
  $('tray').addEventListener('click',onTray);
  $('btnRules').onclick=showRules;
  $('btnReport').onclick=showReport;
  setSound(soundOn);
  $('btnSound').onclick=()=>{setSound(!soundOn);if(soundOn)sfx('select')};
  $('seg').addEventListener('click',e=>{const b=e.target.closest('[data-level]');if(!b)return;G.level=b.dataset.level;render()});
  $('btnNew').onclick=()=>{modal(`<div class="dlg"><div class="h2">Start a new game?</div><p>This game will be lost.</p><div class="row"><button class="btn primary" id="yesNew" type="button">Start a new game</button><button class="btn" data-close type="button">Keep playing</button></div></div>`);$('yesNew').onclick=restart};
  G=load()||newGame();
  G.level=G.level||'normal';G.events=G.events||[];G.timeline=G.timeline||[];G.deep=G.deep||{south:0,north:0};
  render();
  if(G.phase==='play'&&G.turn==='north'){ui.busy=true;render();setTimeout(cpuTurn,800)}
}
boot();
})();
</script>
